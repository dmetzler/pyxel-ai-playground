services:
  backend:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      # LiteLLM runs on the laptop, outside Docker.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:4001}
      GAMES_DIR: /games
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./games:/games
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
