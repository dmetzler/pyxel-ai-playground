apiVersion: v1
kind: Service
metadata:
  name: {{ include "pyxel.backendName" . }}
  labels:
    {{- include "pyxel.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "pyxel.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
