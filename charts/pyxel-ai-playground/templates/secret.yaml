{{- if include "pyxel.renderSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pyxel.secretName" . }}
  labels:
    {{- include "pyxel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.openai.existingSecret }}
  api-key: {{ required "openai.apiKey is required (or set openai.existingSecret)" .Values.openai.apiKey | quote }}
  {{- end }}
  {{- if and .Values.auth.enabled (not .Values.oauth2Proxy.existingSecret) }}
  client-id: {{ required "oauth2Proxy.clientId is required when auth.enabled=true (or set oauth2Proxy.existingSecret)" .Values.oauth2Proxy.clientId | quote }}
  client-secret: {{ required "oauth2Proxy.clientSecret is required when auth.enabled=true (or set oauth2Proxy.existingSecret)" .Values.oauth2Proxy.clientSecret | quote }}
  cookie-secret: {{ required "oauth2Proxy.cookieSecret is required when auth.enabled=true (or set oauth2Proxy.existingSecret); generate with: openssl rand -base64 32 | tr -- '+/' '-_' | head -c 32" .Values.oauth2Proxy.cookieSecret | quote }}
  {{- end }}
{{- end }}
