apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pyxel.backendName" . }}
  labels:
    {{- include "pyxel.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Games live on a ReadWriteOnce volume as git repositories: a single writer only.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pyxel.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pyxel.selectorLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LITELLM_BASE_URL
              value: {{ .Values.openai.baseUrl | quote }}
            - name: LITELLM_MODEL
              value: {{ .Values.openai.model | quote }}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pyxel.openaiSecretName" . }}
                  key: api-key
            - name: PIX_MAX_TOKENS
              value: {{ .Values.maxTokens | quote }}
            - name: GAMES_DIR
              value: /games
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: games
              mountPath: /games
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: games
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pyxel.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
